name: Security checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Create isolated project environment
        run: python -m venv .venv

      - name: Install project and development dependencies
        run: .venv/bin/python -m pip install -r requirements.txt

      - name: Run tests
        run: .venv/bin/python -m pytest

      - name: Scan source with Bandit
        run: .venv/bin/bandit -c pyproject.toml -r src

      - name: Audit installed dependencies
        run: .venv/bin/pip-audit --local --skip-editable
