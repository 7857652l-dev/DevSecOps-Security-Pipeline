[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "devsecops-security-pipeline-demo"
version = "0.1.0"
description = "A small CLI application for demonstrating security checks in CI/CD."
requires-python = ">=3.10"

[project.optional-dependencies]
dev = [
    "bandit[toml]>=1.7,<2",
    "pip-audit>=2.7,<3",
    "pip>=26.2",
    "pytest>=9.0.3,<10",
]

[project.scripts]
security-pipeline = "security_pipeline.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.bandit]
exclude_dirs = ["tests"]
